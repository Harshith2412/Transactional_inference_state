[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transactional-inference-state"
version = "0.1.0"
description = "A deterministic experimental runtime for transactional inference state"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "ollama: optional test requiring a configured local Ollama model",
  "checkpoint_backend: optional test requiring a Linux CRIU/DMTCP host",
]
